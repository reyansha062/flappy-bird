<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyansh's Cyber Flap</title>
    <style>
        body { margin: 0; background: #0d0e15; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; color: #fff; }
        h1 { margin-bottom: 10px; font-size: 28px; letter-spacing: 2px; text-transform: uppercase; background: linear-gradient(45deg, #ff007f, #00f0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 10px rgba(0,240,255,0.3); }
        canvas { border: 3px solid #00f0ff; background: linear-gradient(to bottom, #141526, #212441); box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); border-radius: 8px; cursor: pointer; }
        .instructions { margin-top: 15px; font-size: 14px; color: #8a8da4; text-align: center; }
    </style>
</head>
<body>

<h1>Reyansh's Cyber Flap</h1>
<canvas id="gameCanvas" width="450" height="600"></canvas>
<div class="instructions">Press <b>SPACEBAR</b> or <b>CLICK</b> to fly</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game Mechanics
let birdY = 300, birdVelocity = 0, gravity = 0.35, jump = -6.8, birdX = 60, birdSize = 24;
let pipes = [], pipeWidth = 70, pipeGap = 160, pipeSpeed = 3, frameCount = 0;
let score = 0, highScore = localStorage.getItem("reyansh_highScore") || 0;
let gameOver = false, particles = [];

function resetGame() {
    birdY = 300; birdVelocity = 0; pipes = []; particles = []; score = 0; gameOver = false; frameCount = 0; pipeSpeed = 3;
}

function spawnPipe() {
    const minHeight = 60, maxHeight = canvas.height - pipeGap - minHeight;
    const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
    pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - topHeight - pipeGap, passed: false });
}

function createParticles() {
    if(!gameOver && Math.random() > 0.4) {
        particles.push({ x: birdX, y: birdY + birdSize/2, size: Math.random() * 5 + 2, color: 'rgba(0, 240, 255, 0.6)', alpha: 1, speedX: -Math.random()*2 - 1 });
    }
}

function update() {
    if (gameOver) return;
    frameCount++; birdVelocity += gravity; birdY += birdVelocity;
    createParticles();

    // Floor/Ceiling
    if (birdY + birdSize > canvas.height || birdY < 0) gameOver = true;

    if (frameCount % 100 === 0) { spawnPipe(); if(pipeSpeed < 6) pipeSpeed += 0.1; }

    // Particles update
    for(let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].speedX; particles[i].alpha -= 0.02;
        if(particles[i].alpha <= 0) particles.splice(i, 1);
    }

    // Pipes update
    for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= pipeSpeed;
        if (birdX + birdSize > pipes[i].x && birdX < pipes[i].x + pipeWidth && (birdY < pipes[i].top || birdY + birdSize > canvas.height - pipes[i].bottom)) {
            gameOver = true;
        }
        if (!pipes[i].passed && pipes[i].x + pipeWidth < birdX) {
            score++; pipes[i].passed = true;
            if (score > highScore) { highScore = score; localStorage.setItem("reyansh_highScore", highScore); }
        }
        if (pipes[i].x + pipeWidth < 0) pipes.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid Background effect
    ctx.strokeStyle = "rgba(255, 255, 255, 0.03)"; ctx.lineWidth = 1;
    for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
    for(let j=0; j<canvas.height; j+=40) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); ctx.stroke(); }

    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // Glowing Neon Bird
    ctx.shadowBlur = 15; ctx.shadowColor = "#ff007f"; ctx.fillStyle = "#ff007f";
    ctx.fillRect(birdX, birdY, birdSize, birdSize); ctx.shadowBlur = 0;

    // Neon Pipes
    pipes.forEach(pipe => {
        ctx.fillStyle = "#00f0ff"; ctx.shadowBlur = 10; ctx.shadowColor = "#00f0ff";
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
        ctx.shadowBlur = 0;
    });

    // Interface with your name
    ctx.fillStyle = "#fff"; ctx.font = "bold 20px 'Segoe UI'"; ctx.fillText("SCORE: " + score, 25, 45);
    ctx.fillStyle = "#8a8da4"; ctx.font = "16px 'Segoe UI'"; ctx.fillText("BEST: " + highScore, 25, 75);
    ctx.fillStyle = "#00f0ff"; ctx.font = "bold 14px 'Segoe UI'"; ctx.fillText("CREATOR: REYANSH", 25, canvas.height - 25);

    if (gameOver) {
        ctx.fillStyle = "rgba(13, 14, 21, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff007f"; ctx.font = "bold 42px 'Segoe UI'"; ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillStyle = "#fff"; ctx.font = "18px 'Segoe UI'";
        ctx.fillText("Tap Screen or Space to Restart", canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "left";
    }
}

// Loop execution
function loop() { update(); draw(); requestAnimationFrame(loop); }
function handleJump() { if (gameOver) resetGame(); else birdVelocity = jump; }
window.addEventListener("keydown", (e) => { if (e.code === "Space") handleJump(); });
canvas.addEventListener("click", () => { handleJump(); }); loop();
</script>
</body>
</html>
